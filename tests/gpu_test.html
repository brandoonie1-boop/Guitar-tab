<!doctype html><meta charset="utf-8"><title>gpu test</title>
<pre id="out">running</pre>
<script type="module">
// Runs the separation on a short excerpt with the WebGPU EP and with the (validated) WASM EP, and compares.
import { separate } from '../engine/demucs.js';
const out = document.getElementById('out');
const T0 = performance.now();
const log = (s) => { const line = `[${((performance.now() - T0) / 1000).toFixed(1)}s] ${s}`; out.textContent += '\n' + line; console.log(line); };
const params = new URLSearchParams(location.search);
const model = params.get('model') || 'models/htdemucs_6s.f16.onnx';
const secs = Number(params.get('secs') || 6);
const eps = (params.get('eps') || 'webgpu,wasm').split(',');
async function wasmBinary(key) {
  const manifest = await (await fetch('../assets.json')).json();
  const parts = await Promise.all(manifest.assets[key].parts.map((p) => fetch('../' + p).then((r) => r.arrayBuffer())));
  const tot = parts.reduce((s, p) => s + p.byteLength, 0); const wb = new Uint8Array(tot); let o = 0;
  for (const p of parts) { wb.set(new Uint8Array(p), o); o += p.byteLength; }
  return wb;
}
async function run(ep, left, right) {
  const mod = await import(ep === 'webgpu' ? '../vendor/ort/ort.webgpu.bundle.min.mjs' : '../vendor/ort/ort.wasm.bundle.min.mjs');
  const ort = mod.default && mod.default.InferenceSession ? mod.default : mod;
  ort.env.wasm.wasmBinary = await wasmBinary(ep === 'webgpu' ? 'ortWasmGpu' : 'ortWasm');
  ort.env.wasm.numThreads = 1;
  const bytes = new Uint8Array(await (await fetch('../' + model)).arrayBuffer());
  const session = await ort.InferenceSession.create(bytes, { executionProviders: [ep] });
  log(`${ep}: session ready`);
  const res = await separate(ort, session, left, right, { keep: { guitar: 'stereo', drums: 'stereo' }, check: true, onCheck: (snr) => log(`${ep}: recon check ${snr.toFixed(1)} dB`) });
  log(`${ep}: separate done`);
  return res;
}
try {
  const inp = new Float32Array(await (await fetch('../testdata/sep_in.f32')).arrayBuffer());
  const n = inp.length / 2, m = Math.round(secs * 44100);
  const L = inp.slice(0, m), R = inp.slice(n, n + m);
  const res = {};
  for (const ep of eps) res[ep] = await run(ep, L, R);
  if (res.webgpu && res.wasm) {
    for (const s of ['guitar', 'drums']) {
      let e = 0, r = 0, mx = 0;
      for (let c = 0; c < 2; c++) for (let i = 0; i < m; i++) { const d = res.webgpu[s][c][i] - res.wasm[s][c][i]; e += d * d; r += res.wasm[s][c][i] ** 2; mx = Math.max(mx, Math.abs(d)); }
      log(`${s}: webgpu vs wasm SNR ${(10 * Math.log10(r / e)).toFixed(1)} dB, max err ${mx.toExponential(2)}`);
    }
  }
  log('DONE');
} catch (e) { log('ERROR ' + (e && e.stack || e)); log('DONE'); }
</script>
