<!doctype html><meta charset="utf-8"><title>synth render</title><body><pre id="log"></pre>
<script type="module">
// Renders a saved tab with every tab-player sound (tests/synth_render.mjs drives this page).
import * as alphaTab from '../vendor/alphatab/alphaTab.mjs';
import { scoreEvents, renderTab, TONES } from '../app/guitarsynth.js';
const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
window.renderAll = async (tab, from, to) => {
  const settings = new alphaTab.Settings();
  const score = alphaTab.importer.ScoreLoader.loadAlphaTex(tab.alphaTex, settings);
  score.applyFlatSyncPoints(tab.syncPoints);
  const ev = scoreEvents(score, 0, tab.syncPoints, null);
  const out = {};
  for (const tone of Object.keys(TONES)) {
    try {
      const t0 = performance.now();
      const buf = await renderTab(ev, tone, from, to);
      const L = buf.getChannelData(0), R = buf.getChannelData(1);
      const pcm = new Int16Array(L.length * 2);
      let pk = 0;
      for (let i = 0; i < L.length; i++) pk = Math.max(pk, Math.abs(L[i]), Math.abs(R[i]));
      const g = pk > 0.98 ? 0.98 / pk : 1;
      for (let i = 0; i < L.length; i++) { pcm[2 * i] = Math.round(L[i] * g * 32767); pcm[2 * i + 1] = Math.round(R[i] * g * 32767); }
      let bin = '';
      const u8 = new Uint8Array(pcm.buffer);
      for (let i = 0; i < u8.length; i += 32768) bin += String.fromCharCode(...u8.subarray(i, i + 32768));
      out[tone] = { b64: btoa(bin), sr: buf.sampleRate, peak: pk, ms: Math.round(performance.now() - t0) };
      log(tone + ' ok peak ' + pk.toFixed(3));
    } catch (e) { out[tone] = { error: String(e && e.stack || e) }; log(tone + ' ERROR ' + e); }
  }
  return { events: ev.length, first: ev.slice(0, 6).map((e) => ({ t: +e.t.toFixed(3), s: e.s, pitch: e.pitch, legato: e.legato, bend: e.bend })), out };
};
log('ready');
</script>
